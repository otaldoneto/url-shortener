spring.application.name=url-shortener

# PostgreSQL: the source of truth for every short link
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/shortener}
spring.datasource.username=${DB_USERNAME:shortener}
spring.datasource.password=${DB_PASSWORD:shortener}
# The schema is created by Flyway migrations; Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Redis: the cache in front of PostgreSQL
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# Public address of this service, used to build the short URLs returned by the API
app.base-url=${APP_BASE_URL:http://localhost:8080}
